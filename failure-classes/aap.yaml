id: aap-failures
version: "1.0"
description: AAP2 provisioning job failure classifications
source: aap2_grafana

classes:
  vm_provisioning_timeout:
    pattern: "(Wait till VM is running|VMI does not exist|printableStatus.*Provisioning|attempts.*30)"
    description: VirtualMachine stuck in Provisioning — VMI never created or started
    severity: high
    team: platform-ops
    remediation:
      - Check DataVolume status in the sandbox namespace
      - Verify storage class has available capacity (ocs-storagecluster-ceph-rbd)
      - Check node scheduling constraints and resource availability
      - Verify Assisted Installer pods are running
      - "oc get datavolume -n {namespace}"
      - "oc get vm -n {namespace} -o yaml | grep -A5 status"

  ec2_capacity_exhausted:
    pattern: "(InsufficientInstanceCapacity|Unable to start instances)"
    description: AWS EC2 capacity exhausted — cannot start instances in region
    severity: high
    team: infra
    remediation:
      - Retry in a different availability zone
      - Use a different instance type
      - Contact AWS support for capacity increase
      - Check AWS Service Health Dashboard for region issues

  ssh_connection_failed:
    pattern: "(Shared connection to .* closed|ssh.*connection refused|Connection reset by peer)"
    description: SSH connection to bastion or target host failed
    severity: medium
    team: platform-ops
    remediation:
      - Verify bastion host is running and accessible
      - Check SSH key configuration and permissions
      - Verify network connectivity to target host
      - Retry provisioning — may be transient network issue

  service_unavailable:
    pattern: "(503.*Service Unavailable|Status code was 503|HTTP Error 503)"
    description: Application returned 503 — service not ready during provisioning
    severity: medium
    team: lab-developer
    remediation:
      - Wait for application pods to become ready
      - Check pod readiness probes and startup time
      - Verify route and service configuration
      - "oc get pods -n {namespace} | grep -v Running"

  vault_decryption_failed:
    pattern: "(Decryption failed|no vault secrets were found|AnsibleVaultError)"
    description: Ansible Vault decryption failed — missing or wrong vault password
    severity: critical
    team: platform-ops
    remediation:
      - Verify vault password file is accessible to the execution environment
      - Check that the correct vault ID is configured
      - Verify secret injection from external secrets manager
      - Contact platform-ops to check vault configuration

  eda_config_error:
    pattern: "(rulebook_id.*required|Failed to create.*rulebook)"
    description: Event-Driven Ansible configuration error — missing required fields
    severity: medium
    team: lab-developer
    remediation:
      - Update the ansible playbook to include the required rulebook_id field
      - Check EDA controller API for required request fields
      - Verify rulebook exists in the EDA controller

  api_resolution_error:
    pattern: "(error resolving resource|Internal error occurred.*resolving)"
    description: Kubernetes API internal error — CRD or resource resolution failed
    severity: high
    team: platform-ops
    remediation:
      - Verify the CRD is installed on the target cluster
      - Check API server health and connectivity
      - "oc get crd | grep <resource>"
      - Retry provisioning — API server may recover

  assisted_installer_failed:
    pattern: "(Assisted Installer|installer Pods in Error|Start cluster installation.*Timeout)"
    description: OpenShift Assisted Installer failed — cluster installation did not complete
    severity: high
    team: platform-ops
    remediation:
      - Check assisted-installer pod logs
      - Verify host discovery and validation passed
      - Check network connectivity between hosts
      - "oc logs -n assisted-installer -l app=assisted-installer"

  job_cancelled:
    pattern: "(canceled due to receiving a shutdown signal|Task was canceled)"
    description: Job was cancelled due to platform shutdown — not a real failure
    severity: low
    team: platform-ops
    remediation:
      - No action needed — job was cancelled by platform shutdown
      - Retry the job after platform restart

  vm_creation_failed:
    pattern: "(Create VMs.*FAILED|virt_roadshow_vmware)"
    description: Virtual machine creation failed in VMware/CNV workload
    severity: high
    team: lab-developer
    remediation:
      - Check VMware/CNV resource availability
      - Verify storage and network configuration for VMs
      - Check workload role configuration

  connection_refused:
    pattern: "(Connection refused|Failed to establish a new connection|Max retries exceeded)"
    description: Connection to cluster API or service refused — cluster may be down
    severity: high
    team: platform-ops
    remediation:
      - Verify the target cluster is running and API is accessible
      - Check certificate validity and renewal status
      - "oc get nodes on the target cluster"
      - Check cluster-bot or monitoring for cluster health

  aap_job_timeout:
    pattern: "(job.*timed? ?out|Timeout.*job|exceeded.*timeout|timeout.*exceeded)"
    description: "AAP2 controller job exceeded its timeout — common on CNV and Equinix workloads with long provisioning times (validated against Confluence)"
    severity: medium
    team: platform-ops
    remediation:
      - Check if the job eventually completed despite the timeout
      - "Review AAP job logs for actual duration vs configured timeout"
      - Consider increasing the AAP2 controller job timeout (Confluence recommends 6h for CNV/Equinix)
      - Check if the timeout is configurable via AgnosticV common.yaml

  ansible_playbook_bug:
    pattern: "(Invalid data passed to 'loop|Finalization of task args|dict2items requires|AnsibleUndefined)"
    description: "Ansible playbook bug in AgnosticD/governor code — loop argument errors, task argument resolution failures, template type mismatches. Distinct from infrastructure failures (validated against Confluence: Troubleshooting Destroy)"
    severity: high
    team: lab-developer
    remediation:
      - "This is a code bug in the playbook, not an infrastructure issue"
      - "Check the failing task name in the AAP job logs"
      - "File a PR against the agnosticd or governor repository"
      - "Do NOT retry the job — it will fail the same way"

  cascade_failure:
    pattern: "(Previous Task Failed|cascade|downstream.*failure|dependency.*failed)"
    description: "Downstream failure caused by an earlier task failure in the same playbook run — the root cause is upstream, not at this task (validated against Confluence: Troubleshooting Provision)"
    severity: medium
    team: platform-ops
    remediation:
      - "The root cause is the PREVIOUS task that failed, not this one"
      - "Check the AAP job logs for the first failure in the run"
      - "Fix the upstream failure and this will resolve"
      - "Do NOT remediate at this level"

  ocp_config_missing:
    pattern: "(ocp_console_embed_domain is empty|openshift_cluster_ingress_domain.*not set|required.*variable.*empty|config.*missing)"
    description: "Required OpenShift configuration variable is empty or missing — typically ocp_console_embed_domain or openshift_cluster_ingress_domain (validated against Confluence and production evidence)"
    severity: medium
    team: lab-developer
    remediation:
      - "Set the missing configuration variable in the AgnosticV catalog item"
      - "Check common.yaml for the required variables"
      - "This is a catalog item configuration issue, not an infrastructure problem"

  storage_cluster_timeout:
    pattern: "(Failed to gather.*StorageCluster|storage.*cluster.*timeout|odf.*timeout|ocs.*waiting)"
    description: "Timed out waiting for StorageCluster/ODF to become ready — storage infrastructure not converging within the expected window (validated against production evidence: 47+ occurrences/week)"
    severity: high
    team: platform-ops
    remediation:
      - "Check StorageCluster status and health"
      - "oc get storagecluster -n openshift-storage"
      - "Check Ceph health: ceph health detail"
      - "This may indicate underlying Ceph/ODF degradation"

  lab_content_missing:
    pattern: "(lab.*content.*missing|content.*not.*found|git.*clone.*fail.*content|workshop.*files.*missing)"
    description: "Lab content (Git repository, workshop files, or configuration) is missing or inaccessible — classifier-proposed at 0.86 confidence across 14 production cases"
    severity: medium
    team: lab-developer
    remediation:
      - "Check if the lab's Git repository is accessible"
      - "Verify the content URL in the AgnosticV catalog item"
      - "This is a content/packaging issue, not an infrastructure problem"

  json_decode_error:
    pattern: "(Expecting value: line 1 column 1|JSONDecodeError|json: cannot unmarshal|error decoding JSON)"
    description: "External API returned a non-JSON body (usually a 5xx HTML error page) and the playbook called response.json() without checking the response type. Validated by the Oct 21-22 2026 incident: sso.redhat.com and api.openshift.com returned 5xx and the Assisted Installer integration crashed (Confluence 511804406; fix AI#8 / agd-v2#227)"
    severity: high
    team: platform-ops
    remediation:
      - "Root cause is an external dependency returning 5xx — check sso.redhat.com and api.openshift.com status"
      - "Do NOT re-provision immediately — the failure is external and will persist while the dependency is down"
      - "Fix AI#8 / agd-v2#227 adds defensive response-type checking and retry — verify it is deployed"
      - "If recurring, check whether the AI (Assisted Installer) service has a status page or health endpoint"

  cluster_capacity_saturated:
    pattern: "(cluster.*saturat|memory.*saturat|capacity.*exhaust.*cluster|no.*healthy.*cluster|cluster.*full)"
    description: "Cluster-level resource saturation causing diverse provision failures — the correlation signature is many DIFFERENT symptom classes (vmi_not_running, datavolume_failed, pods_not_ready, showroom_not_ready) on the SAME cluster in the SAME window. Validated by the Oct 13-14 2026 incident: ocpv06 memory-saturated, ocpv08 sick nodes (RHDPOPS-24544; Confluence 501907733). Single-message matching is insufficient — see incident-validation-2026-10.md"
    severity: high
    team: platform-ops
    remediation:
      - "Check node memory and NotReady status on the affected cluster"
      - "oc get nodes; oc describe node for the saturated cluster"
      - "If confirmed: disable the cluster in the catalog, let the queue drain, re-enable with headroom"
      - "Do NOT chase individual symptom failures — they share one cause"
      - "This class requires correlation across evaluations, not single-message matching"

  gpu_capacity_unavailable:
    pattern: "(InsufficientInstanceCapacity|capacity reservation.*canceled|no.*GPU.*capacity|g6\\.12xlarge.*unavailable)"
    description: "Cloud GPU capacity unavailable — on-demand capacity reservation failed across all AZs (validated: LB2861 Introducing llm-d AWS, Summit Retest Sep 30 — InsufficientInstanceCapacity for 1x g6.12xlarge in us-east-1, reservation canceled)"
    severity: high
    team: platform-ops
    remediation:
      - "Check GPU instance availability in the target region"
      - "Consider a different instance type or region"
      - "AWS on-demand capacity reservations can fail across all AZs during high demand"
      - "Check if the lab has a fallback configuration"

  placement_pin_missing:
    pattern: "(not pinned|wrong.*cluster|placement.*pin|event\\.yaml.*selector|sandbox.*selector.*prod)"
    description: "Workload landed on the wrong cluster — missing placement pin in event.yaml or sandbox selector pointing at prod instead of events (validated: Summit Retest Sep 30 CRITICAL — Retest traffic hit shared/production capacity; fix agnosticv#28356; Confluence 491356483 row 8-9)"
    severity: high
    team: lab-developer
    remediation:
      - "Check the catalog item's event.yaml for the cluster pin"
      - "Verify the sandbox selector actually selects events, not prod"
      - "Impact: production capacity affected by event traffic"
      - "Fix is an AgnosticV PR pinning the item to the event cluster pool"

  image_pull_denied:
    pattern: "(image.*pull.*denied|pull.*access.*denied|unauthorized.*pull|ErrImagePull.*denied)"
    description: "Container image pull denied — registry credentials or repository permissions missing (validated: LB1758 RAG Cluster CI — llamastack image pull denied; GPTEINFRA-18139)"
    severity: high
    team: lab-developer
    remediation:
      - "Check the image reference and required pull credentials"
      - "Verify registry.redhat.io or quay.io secrets exist in the namespace"
      - "This is a content/packaging issue, not an infrastructure problem"
