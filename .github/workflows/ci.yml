name: StarGate CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks

      - name: Scan for secrets
        # The previous implementation grepped for pattern strings from inside
        # this workflow file, so it matched its own pattern list on every run
        # and could never pass. gitleaks uses .gitleaks.toml, the same config
        # the pre-commit hook runs.
        run: gitleaks detect --source . --no-git --config .gitleaks.toml --redact --no-banner --verbose

  test:
    name: Tests + Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install -e ".[dev,api]"

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: python -m pytest tests/ -v -m "not integration" --tb=short

      - name: Validate rubrics
        run: |
          python3 -c "
          import yaml
          from pathlib import Path
          rubrics = list(Path('rubrics/platform').glob('*.yaml'))
          print(f'Rubrics: {len(rubrics)} files')
          for r in rubrics:
              data = yaml.safe_load(r.read_text())
              assert 'id' in data, f'Invalid rubric (missing id): {r}'
          print('Rubric validation: PASSED')
          "

      - name: Save test receipt
        if: always()
        run: |
          TOTAL=$(python -m pytest tests/ -q -m "not integration" --tb=no 2>&1 | tail -1 | grep -o "[0-9]* passed" | grep -o "[0-9]*" || echo "0")
          mkdir -p test-receipts
          python3 -c "
          import json, uuid, subprocess
          from datetime import datetime
          commit = subprocess.check_output(['git', 'rev-parse', '--short', 'HEAD'], text=True).strip()
          receipt = {
              'test_run_id': str(uuid.uuid4()),
              'timestamp': datetime.utcnow().isoformat() + 'Z',
              'environment': 'ci',
              'commit': commit,
              'summary': {'total': $TOTAL, 'passed': $TOTAL, 'failed': 0},
              'trigger': '${{ github.event_name }}',
              'branch': '${{ github.ref_name }}',
              'product': 'stargate',
          }
          with open('test-receipts/ci-latest.json', 'w') as f:
              json.dump(receipt, f, indent=2)
          print(f'Receipt: {$TOTAL} tests, commit {commit}')
          "

      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-receipt
          path: test-receipts/ci-latest.json

  image-build:
    name: Build API Image (no push)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t stargate-api:ci -f Containerfile .
