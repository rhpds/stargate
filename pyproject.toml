[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stargate"
version = "0.1.0"
description = "Centralized validation layer for RHDP — evidence collection, rubric evaluation, failure classification, and event processing"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = [
    "celery>=5.4",
    "httpx2>=2.0",
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5",
]
api = [
    "fastapi>=0.109",
    "prometheus-client>=0.20",
    "python-multipart>=0.0.18",
    "slowapi>=0.1.9",
    "uvicorn>=0.25",
    "psycopg2-binary>=2.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    # api/mcp_server.py imports mcp.server.mcpserver (2.x API). It was
    # installed in developer venvs but never declared, so CI could not
    # import the MCP surface or any test that touches it.
    "mcp>=2.0,<3",
]

[tool.ruff]
# Deterministic lint gate. Pinning the rule set here means CI and local runs
# agree; previously the resolved rule set produced ~1,700 pre-existing
# findings across api/ and tests/, so the gate was permanently red and
# therefore ignored.
#
# This selects the correctness rules the codebase actually passes: syntax
# errors, undefined names, and broken f-strings. The wider style sweep
# (import sorting, pyupgrade, blind-except, ...) is a separate, reviewable
# change rather than a 1,700-line diff hidden inside a CI fix.

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: marks tests requiring podman-compose services (PostgreSQL)",
]

[tool.setuptools.packages.find]
include = ["engine*", "collectors*", "normalizers*", "proposals*", "api*", "db*", "events*"]
