api:
  image: stargate-api:latest
  replicas: 1
  port: 8090
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi
  env:
    STARGATE_DATABASE_URL: ""  # Set via Helm --set or template referencing secrets
    STARGATE_SSL_VERIFY: "false"
    STARGATE_GATE_SOURCE_INGESTION: "false"
    STARGATE_GATE_DIAGNOSIS_CLAIMS: "false"
    STARGATE_GATE_SLACK_DELIVERY: "false"
    STARGATE_GATE_JIRA_DRAFTING: "false"
    STARGATE_GATE_JIRA_EXECUTION: "false"
    STARGATE_GATE_KNOWLEDGE_RETRIEVAL: "false"
    STARGATE_GATE_TREND_DETECTION: "false"
    STARGATE_SCAN_SNAPSHOT_RETENTION_DAYS: "7"
    STARGATE_SCAN_SNAPSHOT_CLEANUP_BATCH: "1000"

scanner:
  image: stargate-scanner:latest
  apiUrl: http://stargate-api:8090
  sandboxApiUrl: http://sandbox-api.babylon-sandbox-api.svc:8080
  labagatorUrl: ""
  demolitionUrl: ""
  clusters: ocpv05,ocpv06,ocpv07,ocpv08,ocpv09,ocpv-infra01,ocpv-infra02,ocp-us-east-1
  tier1: 300
  tier2: 900
  tier3: 600
  batch: 25
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi

babylonWorker:
  image: stargate-scanner:latest
  interval: 180
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 2Gi

frontend:
  image: stargate-frontend:latest
  replicas: 1
  port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

postgres:
  image: postgres:15
  storage: 10Gi
  user: stargate
  password: ""  # REQUIRED — set via --set or values override
  database: stargate

secrets:
  mountPath: /opt/app-root/src/secrets
  litellmApiKey: ""
  adminApiKey: ""

scanHistory:
  storage: 5Gi

routes:
  frontend: ""  # Set to your cluster's apps domain
  api: ""       # Set to your cluster's apps domain

oauth:
  enabled: false
  image: registry.redhat.io/openshift4/ose-oauth-proxy:latest
  cookieSecret: ""
