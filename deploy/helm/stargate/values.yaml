api:
  image: stargate-api:latest
  replicas: 1
  port: 8090
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    # One core was the limit on both production replicas and they throttled
    # 18.5% and 14.2% of CFS periods while averaging 0.70 cores each: the
    # evidence uploads from every cluster arrive here, and the requests
    # waiting behind them are the slow end of /evaluate. See
    # docs/config-log.md. Raising the limit is not a halving of latency —
    # there is one uvicorn process per pod, so the GIL bounds a single
    # request — but the throttle goes away, which is what the 10 s tail is.
    limits:
      cpu: "2"
      memory: 2Gi
  env:
    STARGATE_DATABASE_URL: ""  # Set via Helm --set or template referencing secrets
    STARGATE_SSL_VERIFY: "false"
    STARGATE_GATE_SOURCE_INGESTION: "false"
    STARGATE_GATE_DIAGNOSIS_CLAIMS: "false"
    STARGATE_GATE_SLACK_DELIVERY: "false"
    STARGATE_GATE_JIRA_DRAFTING: "false"
    STARGATE_GATE_JIRA_EXECUTION: "false"
    STARGATE_GATE_KNOWLEDGE_RETRIEVAL: "false"
    STARGATE_GATE_TREND_DETECTION: "false"
    STARGATE_SCAN_SNAPSHOT_RETENTION_DAYS: "7"
    STARGATE_SCAN_SNAPSHOT_CLEANUP_BATCH: "1000"

scanner:
  image: stargate-scanner:latest
  apiUrl: http://stargate-api:8090
  sandboxApiUrl: http://sandbox-api.babylon-sandbox-api.svc:8080
  labagatorUrl: ""
  demolitionUrl: ""
  # Provisioning clusters only. ocpv05 was retired (its API host no longer
  # resolves); infra01/02 and ocp-us-east-1 are not provisioning clusters and
  # are queried directly by the gap detectors. This single value is both
  # --clusters and STARGATE_CLUSTERS, so it defines the fleet.
  clusters: ocpv03,ocpv06,ocpv07,ocpv08,ocpv09
  tier1: 300
  tier2: 900
  tier3: 600
  batch: 25
  # Five cluster workers share this one pod, each spawning a
  # `python3 -m cli.stargate` subprocess per namespace, plus the Babylon
  # worker. At a limit of 1 the pod sat at 973m and was throttled in 76% of
  # CFS periods, which is the leading explanation for tier 3's 0.5-4.2 h
  # sweeps and tier 1's 760-950 s median against a 300 s target.
  # Measured 2026-11-23 on a node with 95.5 cores allocatable and 30% CPU
  # requests, so the headroom is real rather than borrowed. See
  # docs/cluster-fleet.md.
  resources:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      cpu: "3"
      memory: 2Gi

babylonWorker:
  image: stargate-scanner:latest
  interval: 180
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 2Gi

frontend:
  image: stargate-frontend:latest
  replicas: 1
  port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

postgres:
  image: postgres:15
  storage: 10Gi
  user: stargate
  password: ""  # REQUIRED — set via --set or values override
  database: stargate

secrets:
  mountPath: /opt/app-root/src/secrets
  litellmApiKey: ""
  adminApiKey: ""

scanHistory:
  storage: 5Gi

routes:
  frontend: ""  # Set to your cluster's apps domain
  api: ""       # Set to your cluster's apps domain

oauth:
  enabled: false
  image: registry.redhat.io/openshift4/ose-oauth-proxy:latest
  cookieSecret: ""
