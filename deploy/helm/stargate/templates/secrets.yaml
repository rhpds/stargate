apiVersion: v1
kind: Secret
metadata:
  name: stargate-secrets
type: Opaque
stringData:
  {{- if .Values.postgres.password }}
  postgres-password: {{ .Values.postgres.password | quote }}
  {{- end }}
  {{- if .Values.secrets.litellmApiKey }}
  litellm-api-key: {{ .Values.secrets.litellmApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.adminApiKey }}
  admin-api-key: {{ .Values.secrets.adminApiKey | quote }}
  {{- end }}
