apiVersion: apps/v1
kind: Deployment
metadata:
  name: stargate-api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: stargate-api
  template:
    metadata:
      labels:
        app: stargate-api
    spec:
      serviceAccountName: {{ .Values.oauth.enabled | ternary "stargate-oauth" "stargate-api" }}
      securityContext:
        runAsNonRoot: true
      containers:
        - name: api
          image: {{ .Values.api.image }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: {{ .Values.api.port }}
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stargate-secrets
                  key: postgres-password
            - name: STARGATE_DATABASE_URL
              value: postgresql://stargate:$(POSTGRES_PASSWORD)@stargate-postgres:5432/stargate
            - name: STARGATE_SSL_VERIFY
              value: {{ .Values.api.env.STARGATE_SSL_VERIFY | default "false" | quote }}
            - name: STARGATE_LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: stargate-secrets
                  key: litellm-api-key
            - name: STARGATE_ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: stargate-secrets
                  key: admin-api-key
            - name: STARGATE_CORS_ORIGINS
              value: {{ .Values.api.env.STARGATE_CORS_ORIGINS | default "http://localhost:3000" | quote }}
            - name: STARGATE_LITELLM_URL
              value: {{ .Values.api.env.STARGATE_LITELLM_URL | default "" | quote }}
            - name: STARGATE_INLINE_SCANNER
              value: {{ .Values.api.env.STARGATE_INLINE_SCANNER | default "false" | quote }}
            - name: STARGATE_API_BABYLON_COLLECTION
              value: {{ .Values.api.env.STARGATE_API_BABYLON_COLLECTION | default "false" | quote }}
            - name: STARGATE_API_CORPUS_MINING
              value: {{ .Values.api.env.STARGATE_API_CORPUS_MINING | default "false" | quote }}
            - name: STARGATE_INVESTIGATE_MAX_PER_DAY
              value: {{ .Values.api.env.STARGATE_INVESTIGATE_MAX_PER_DAY | default "200" | quote }}
            - name: STARGATE_INVESTIGATE_MAX_PER_CATALOG_HOUR
              value: {{ .Values.api.env.STARGATE_INVESTIGATE_MAX_PER_CATALOG_HOUR | default "3" | quote }}
            - name: STARGATE_INVESTIGATE_MAX_PER_SCAN
              value: {{ .Values.api.env.STARGATE_INVESTIGATE_MAX_PER_SCAN | default "10" | quote }}
            - name: STARGATE_INVESTIGATE_PATTERN_DEDUP_HOURS
              value: {{ .Values.api.env.STARGATE_INVESTIGATE_PATTERN_DEDUP_HOURS | default "2" | quote }}
            - name: STARGATE_GATE_SOURCE_INGESTION
              value: {{ .Values.api.env.STARGATE_GATE_SOURCE_INGESTION | default "false" | quote }}
            - name: STARGATE_GATE_DIAGNOSIS_CLAIMS
              value: {{ .Values.api.env.STARGATE_GATE_DIAGNOSIS_CLAIMS | default "false" | quote }}
            - name: STARGATE_GATE_SLACK_DELIVERY
              value: {{ .Values.api.env.STARGATE_GATE_SLACK_DELIVERY | default "false" | quote }}
            - name: STARGATE_GATE_JIRA_DRAFTING
              value: {{ .Values.api.env.STARGATE_GATE_JIRA_DRAFTING | default "false" | quote }}
            - name: STARGATE_GATE_JIRA_EXECUTION
              value: {{ .Values.api.env.STARGATE_GATE_JIRA_EXECUTION | default "false" | quote }}
            - name: STARGATE_GATE_KNOWLEDGE_RETRIEVAL
              value: {{ .Values.api.env.STARGATE_GATE_KNOWLEDGE_RETRIEVAL | default "false" | quote }}
            - name: STARGATE_GATE_TREND_DETECTION
              value: {{ .Values.api.env.STARGATE_GATE_TREND_DETECTION | default "false" | quote }}
            - name: STARGATE_JIRA_URL
              value: {{ .Values.api.env.STARGATE_JIRA_URL | default "" | quote }}
            - name: STARGATE_JIRA_PROJECT
              value: {{ .Values.api.env.STARGATE_JIRA_PROJECT | default "" | quote }}
            - name: STARGATE_JIRA_ISSUE_TYPE
              value: {{ .Values.api.env.STARGATE_JIRA_ISSUE_TYPE | default "Task" | quote }}
            - name: STARGATE_JIRA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: stargate-secrets
                  key: jira-token
                  optional: true
            - name: STARGATE_CLUSTERS
              value: {{ .Values.scanner.clusters | quote }}
            - name: STARGATE_EXECUTOR_KUBECONFIG
              value: {{ .Values.secrets.mountPath }}/kubeconfig-executor
            - name: STARGATE_API_URL
              value: "http://localhost:{{ .Values.api.port }}"
            - name: STARGATE_AAP_CONTROLLERS_FILE
              value: /var/run/secrets/stargate-aap/controllers.yaml
            - name: STARGATE_TRUST_PROXY_AUTH
              value: {{ .Values.oauth.enabled | ternary "true" "false" | quote }}
          volumeMounts:
            - name: scan-history
              mountPath: /opt/app-root/src/scan-history
            - name: secrets
              mountPath: {{ .Values.secrets.mountPath }}
              readOnly: true
            - name: aap-controllers
              mountPath: /var/run/secrets/stargate-aap
              readOnly: true
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
        {{- if .Values.oauth.enabled }}
        - name: oauth-proxy
          image: {{ .Values.oauth.image | default "registry.redhat.io/openshift4/ose-oauth-proxy:latest" }}
          ports:
            - containerPort: 4180
              name: proxy
          args:
            - --https-address=
            - --http-address=:4180
            - --upstream=http://localhost:{{ .Values.api.port }}
            - --cookie-secret-file=/var/run/secrets/oauth/cookie-secret
            - --cookie-name=_stargate_oauth
            - --provider=openshift
            - --openshift-service-account=stargate-oauth
            - --pass-user-headers=true
          volumeMounts:
            - name: oauth-cookie
              mountPath: /var/run/secrets/oauth
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
        {{- end }}
      volumes:
        {{- if .Values.oauth.enabled }}
        - name: oauth-cookie
          secret:
            secretName: {{ .Values.oauth.cookieSecretName | default "stargate-oauth-cookie" }}
        {{- end }}
        - name: scan-history
          persistentVolumeClaim:
            claimName: stargate-scan-history-pvc
        - name: secrets
          secret:
            secretName: stargate-kubeconfigs
        - name: aap-controllers
          secret:
            secretName: stargate-aap-controllers
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: stargate-api
spec:
  ports:
    {{- if .Values.oauth.enabled }}
    - name: proxy
      port: 4180
      targetPort: 4180
    {{- end }}
    - name: api
      port: {{ .Values.api.port }}
      targetPort: {{ .Values.api.port }}
  selector:
    app: stargate-api
