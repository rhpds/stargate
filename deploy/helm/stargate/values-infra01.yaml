# Production values for ocpv-infra01 deployment
#
# Images are pinned by digest, not tag. The live Deployments were pinned with
# `oc set image` long before this file knew it, so a chart-supplied `:latest`
# re-resolved both images to whatever the tag held when the template was
# rendered. api and scanner below are the 2026-11-24 ~22:50 out-of-band release,
# both built from a clean `git archive 3d3ef9f`; frontend and babylonWorker were
# not rebuilt and are pinned to the digests already running.

api:
  image: image-registry.openshift-image-registry.svc:5000/stargate/stargate-api@sha256:34660f01a9446482526e1ca5492f425615bd362aaf07112ee365afbbb0576bf4
  replicas: 2
  env:
    STARGATE_SSL_VERIFY: "false"
    STARGATE_CORS_ORIGINS: ""  # Set at deploy time: --set api.env.STARGATE_CORS_ORIGINS=https://<frontend>,https://<api>
    STARGATE_LITELLM_URL: "https://litellm.example.com/v1/chat/completions"
    STARGATE_INVESTIGATE_MAX_PER_DAY: "200"
    STARGATE_INVESTIGATE_MAX_PER_CATALOG_HOUR: "0"
    STARGATE_INVESTIGATE_MAX_PER_SCAN: "10"
    STARGATE_INVESTIGATE_PATTERN_DEDUP_HOURS: "2"
    STARGATE_SCAN_SNAPSHOT_RETENTION_DAYS: "7"
    STARGATE_SCAN_SNAPSHOT_CLEANUP_BATCH: "1000"
    STARGATE_GATE_SOURCE_INGESTION: "false"
    STARGATE_GATE_DIAGNOSIS_CLAIMS: "false"
    STARGATE_GATE_SLACK_DELIVERY: "false"
    STARGATE_GATE_JIRA_DRAFTING: "false"
    STARGATE_GATE_JIRA_EXECUTION: "false"
    STARGATE_GATE_KNOWLEDGE_RETRIEVAL: "false"
    STARGATE_GATE_TREND_DETECTION: "false"

scanner:
  image: image-registry.openshift-image-registry.svc:5000/stargate/stargate-scanner@sha256:8b2b3860772cdec22397362ee8d9c4a0f284d083fa253553b7847b7ef870c03a
  apiUrl: http://stargate-api:8090
  sandboxApiUrl: http://sandbox-api.babylon-sandbox-api.svc:8080
  labagatorUrl: http://labagator-backend.labagator-prod.svc:8080/api/v1
  demolitionUrl: http://coordinator-api.demolition-prod.svc:8000/api/v1
  # Provisioning clusters only. ocpv05 was retired (its API host no longer
  # resolves); infra01/02 and ocp-us-east-1 are not provisioning clusters and
  # are queried directly by the gap detectors. This single value is both
  # --clusters and STARGATE_CLUSTERS, so it defines the fleet.
  clusters: ocpv03,ocpv06,ocpv07,ocpv08,ocpv09
  tier1: 300
  tier2: 900
  # Must match values.yaml: tier 3 is on its own thread here too, and 600 would
  # become the cadence floor again (ocpv07 2.5h instead of 1.7h).
  tier3: 300
  tier3Independent: true
  batch: 25

babylonWorker:
  image: image-registry.openshift-image-registry.svc:5000/stargate/stargate-scanner@sha256:945cc2f3bab73d1d563c4e52739d4f72d1f66a89e8ea9070613a495c72c1f895
  interval: 180
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 2Gi

frontend:
  image: image-registry.openshift-image-registry.svc:5000/stargate/stargate-frontend@sha256:1eb636578963e31eb5cfe21adfd7eb43d1c0b27728fca8eb3e9596c3946cf8f6
  replicas: 1

postgres:
  storage: 40Gi

scanHistory:
  storage: 10Gi

routes:
  frontend: ""  # Set at deploy time: --set routes.frontend=<hostname>
  api: ""       # Set at deploy time: --set routes.api=<hostname>

oauth:
  enabled: true
  cookieSecret: ""  # Set at install time: --set oauth.cookieSecret=$(openssl rand -hex 16)

# User-workload monitoring is enabled on infra01 (`cluster-monitoring-config`:
# `enableUserWorkload: true`), so these resources are reconciled by
# prometheus-user-workload immediately. Nothing was scraping StarGate before
# this — 356 stargate_* metrics were being served to nobody.
monitoring:
  enabled: true
