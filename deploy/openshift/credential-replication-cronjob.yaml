# Credential replication counter.
#
# Why: fvmw-password reached 951 live copies and aap_image_admin_password 665
# before anyone noticed. Rotation updates the store; nothing counted the copies
# in AnarchySubject vars and Deployment env. This runs the counter every 30
# minutes against the frozen baseline in data/credential-baseline.json and
# reports increases to StarGate as external evidence.
#
# Read-only: hashes strings in memory, never stores or prints a value.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: credential-replication
  namespace: stargate
  labels:
    app: stargate
    component: credential-replication
spec:
  schedule: "17 * * * *"  # hourly; drift persists until the baseline is refreshed
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: stargate
            component: credential-replication
        spec:
          restartPolicy: Never
          containers:
            - name: check
              image: image-registry.openshift-image-registry.svc:5000/stargate/stargate-scanner:latest
              command:
                - python3
                - /opt/app-root/src/scripts/credential_replication_check.py
                - --cluster
                - ocp-us-east-1
                - --kubeconfig
                - /opt/app-root/src/secrets/kubeconfig-ocp-us-east-1
                - --api-url
                - http://stargate-api:8090
              env:
                - name: STARGATE_ADMIN_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: stargate-secrets
                      key: admin-api-key
              volumeMounts:
                - name: kubeconfigs
                  mountPath: /opt/app-root/src/secrets
                  readOnly: true
              resources:
                # The control-plane AnarchySubject dump is large; 512Mi OOMKilled.
                requests:
                  cpu: 100m
                  memory: 512Mi
                limits:
                  cpu: "1"
                  memory: 2Gi
          volumes:
            - name: kubeconfigs
              secret:
                secretName: stargate-kubeconfigs
